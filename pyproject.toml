[project]
name = "ofrenda"
version = "0.1.0"
description = "A forensic interview with a dead open-source project, and a forecast of when it stopped answering people."
requires-python = ">=3.11"

dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "tabpfn>=2.0",
  "ollama>=0.4",
  "pymongo>=4.9",
  "psycopg[binary]>=3.2",
  "temporalio>=1.8",
  "sentry-sdk>=2.19",
  "elevenlabs>=1.9",
  "httpx>=0.27",
]

[project.scripts]
ofrenda-probe = "ofrenda.probe:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

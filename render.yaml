services:
  - type: web
    name: ofrenda-altar
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && pip install -e . --no-deps"
    startCommand: "python -m ofrenda.server"
    healthCheckPath: "/healthz"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: "0.0.0.0"
